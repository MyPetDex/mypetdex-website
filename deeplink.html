<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening MyPetDex…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #4486F418 0%, #EEF4FF 60%, #fff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 60px rgba(68,134,244,0.12);
      border: 1px solid rgba(68,134,244,0.1);
    }
    .logo { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 800; color: #1E293B; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748B; line-height: 1.6; margin-bottom: 24px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #E2E8F0;
      border-top-color: #4486F4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #4486F4;
      color: #fff;
      border-radius: 12px;
      padding: 13px 24px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 8px;
    }
    .back { display: block; margin-top: 16px; font-size: 13px; color: #94A3B8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://home.mypetdex.app/images/logo.png" alt="MyPetDex" />
    <div class="spinner" id="spinner"></div>
    <h1>Opening MyPetDex…</h1>
    <p id="msg">Launching the demo for you.<br/>If the app doesn't open, tap below.</p>
    <a class="btn" id="fallbackBtn" href="https://apps.apple.com/app/mypetdex/id6772248051" style="display:none;">
      Download on App Store
    </a>
    <a class="back" href="https://home.mypetdex.app">← Back to MyPetDex</a>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var target = params.get("target") || "demo";
    var deepLink = target === "demo" ? "mypetdex://demo-login" : "mypetdex://";

    window.location.href = deepLink;

    setTimeout(function() {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("msg").textContent = "App not found. Download MyPetDex on the App Store to get started.";
      document.getElementById("fallbackBtn").style.display = "inline-flex";
    }, 2500);
  </script>
</body>
</html>
